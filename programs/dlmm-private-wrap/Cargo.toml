[package]
name = "dlmm-private-wrap"
version = "0.1.0"
description = "Custodial wrapper that holds Meteora DLMM positions under program PDAs to break the on-chain link between an LP and their position."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "dlmm_private_wrap"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
